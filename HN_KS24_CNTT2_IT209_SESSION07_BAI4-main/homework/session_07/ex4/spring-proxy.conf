# ============================================================
# Nginx Virtual Server Block - Reverse Proxy for Spring Boot
# File: /etc/nginx/sites-available/spring-proxy.conf
# ============================================================

server {
    # Lắng nghe trên cổng 80 (HTTP mặc định)
    listen 80;
    listen [::]:80;

    # Tên máy chủ (dùng _ để khớp với mọi hostname / IP trực tiếp)
    server_name _;

    # Thư mục gốc chứa nội dung tĩnh
    root /var/www/html;
    index index.html;

    # ----------------------------------------------------------
    # Location 1: Static Serve - Phục vụ trang tĩnh tại /
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # ----------------------------------------------------------
    # Location 2: Reverse Proxy - Chuyển tiếp /api/ → Spring Boot :8082
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8082/;

        # Chuyển tiếp thông tin Host và IP thực của client
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Tắt buffering để nhận phản hồi ngay lập tức từ backend
        proxy_buffering off;
    }
}
