# =====================================================
# Spring Boot Backend – IT209 DevOps / Session 07 Bài 4
# Ứng dụng chạy trên cổng 8082 (sau Nginx Reverse Proxy)
# =====================================================

server.port=8082

# Hiển thị thông tin ứng dụng
spring.application.name=proxy-backend

# Actuator – mở endpoint /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Thông tin info endpoint
info.app.name=IT209 Reverse Proxy Backend
info.app.student=Ngô Trung Chiến
info.app.class=HN_KS24_CNTT2_IT209
info.app.session=Session 07 – Bài 4
